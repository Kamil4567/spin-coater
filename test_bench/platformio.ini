; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; CP2102 on this PC (COM1/COM7/COM8 are not the ESP - don't let PIO guess)
upload_port = COM18
monitor_port = COM18
upload_speed = 460800
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11

; Manual download mode (auto-reset circuit not pulling GPIO0 low):
;   1. hold BOOT, tap EN, release BOOT  -> chip waits in download mode
;   2. pio run -e esp32dev_manual -t upload
; esptool will NOT toggle EN before flashing (no_reset), so it won't kick the
; chip out of download mode; after flashing it still hard-resets into the app.
[env:esp32dev_manual]
extends = env:esp32dev
board_upload.before_reset = no_reset
upload_speed = 115200
